<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0809" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>こすくまくんの声</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/voicelab.css" />
  </head>
  <body>
    <main class="lab">
      <header class="head">
        <p class="kicker">万華鏡メーカー <i></i> 調整用</p>
        <h1>こすくまくんの声</h1>
        <p class="lede">声の種類を選んで、つまみを動かして、<br />しっくりくる声を探してください。</p>
      </header>

      <section class="stage" aria-label="試し聞き">
        <div class="bubble"><img src="/charm.png" alt="" width="28" height="35" /><p id="out">……</p></div>
        <button class="play" id="play" type="button">しゃべらせる</button>
      </section>

      <section class="block first" aria-label="セリフ">
        <h2>しゃべらせる文</h2>
        <div class="lines" id="lines"></div>
        <label class="free"><span>好きな文で試す</span><input id="text" type="text" maxlength="60" placeholder="ここに打つと、その文でしゃべる" /></label>
      </section>

      <section class="block" aria-label="声の種類">
        <h2>声の種類</h2>
        <div class="presets" id="presets" role="radiogroup"></div>
        <p class="note" id="preset-note"></p>
      </section>

      <section class="block" aria-label="調整">
        <h2>こまかく調整</h2>
        <div class="knobs" id="knobs"></div>
      </section>

      <section class="block send" aria-label="決める">
        <h2>決まったら</h2>
        <p class="note">下のボタンで設定をコピーして、<br />チャットに貼ってください。サイトの声をこれに合わせます。</p>
        <button class="play solid" id="copy" type="button">この声の設定をコピー</button>
        <pre class="code" id="code"></pre>
        <p class="note small">音が出ないときは、マナーモードを外してください。</p>
      </section>
    </main>
    <script type="module" src="/src/voicelab.ts"></script>
  </body>
</html>
